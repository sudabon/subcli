name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test (unit & static compliance, no real CLIs or credentials)
        run: go test -race -v ./...

      - name: Build
        run: go build ./cmd/subcli

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vet and build
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./cmd/subcli
      - name: Test native Windows process handling
        run: go test -v ./internal/runner ./internal/childcmd ./internal/policy -run 'TestWindows|TestRingBuffer'
